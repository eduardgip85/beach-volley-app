<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Sandset | Sin conexión</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(14, 165, 233, 0.12), transparent 32%),
          linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      }

      main {
        width: min(100%, 440px);
        border-radius: 28px;
        padding: 32px 28px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.24);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.75rem;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #475569;
        line-height: 1.55;
      }

      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 18px;
        border-radius: 999px;
        background: #0f172a;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192.png" alt="Sandset" />
      <h1>Ahora mismo estás sin conexión</h1>
      <p>
        Sandset seguirá abriendo la app y sus recursos básicos, pero para cargar eventos,
        torneos y datos en tiempo real necesitarás volver a conectarte.
      </p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
